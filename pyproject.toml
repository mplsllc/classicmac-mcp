[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "classicmac-mcp"
version = "0.1.0a1"
description = "MCP development platform for Classic Macintosh software"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
classicmac-mcp = "classicmac_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/classicmac_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
